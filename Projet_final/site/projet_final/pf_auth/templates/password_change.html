{% extends "base.html" %}

{% block content %}
<div class="container mt-50">

    <h2 class="text-primary mb-4">Changer mon mot de passe</h2>

    <form method="post">
        {% csrf_token %}

        <div class="card mb-4">
            <div class="card-body">

                <h5 class="mb-3">Sécurité du compte</h5>

                <p class="text-muted mb-4">
                    Pour votre sécurité, veuillez entrer votre mot de passe actuel,
                    puis choisir un nouveau mot de passe.
                </p>

                {{ form.as_p }}

            </div>
        </div>

        <div class="d-flex gap-2">
            <a href="{% url 'compte' %}" class="btn btn-secondary px-20">
                Annuler
            </a>

            <button type="submit" class="btn btn-primary shine px-20">
                Mettre à jour le mot de passe
            </button>
        </div>

    </form>

</div>
{% endblock %}
