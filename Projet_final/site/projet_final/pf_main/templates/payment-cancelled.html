{% extends 'base.html' %}
{% load static %}

{% block title %}Paiement annulé{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm text-center p-5">
                <div class="mb-4">
                    <i class="bi bi-x-circle-fill text-warning" style="font-size: 5rem;"></i>
                </div>
                
                <h2 class="mb-3">Paiement annulé</h2>
                <p class="text-muted mb-4">
                    Votre paiement a été annulé. Aucun montant n'a été débité.
                </p>
                
                <div class="alert alert-warning">
                    <i class="bi bi-info-circle"></i> Votre commande a été supprimée.
                </div>
                
                <div class="d-flex gap-3 justify-content-center mt-4">
                    <a href="{% url 'cart' %}" class="btn btn-primary">
                        <i class="bi bi-cart-fill"></i> Retour au panier
                    </a>
                    <a href="{% url 'accueil' %}" class="btn btn-outline-secondary">
                        <i class="bi bi-house-fill"></i> Accueil
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
